<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CAMPUS BYTE · Inscripción</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet" />

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <style>
    /* ===== RESET & BASE ===== */
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      background: linear-gradient(145deg, #0b1120 0%, #111827 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Inter', sans-serif;
      padding: 1.5rem;
      color: #e2e8f0;
    }
    .main-container {
      max-width: 820px;
      width: 100%;
      background: rgba(17, 24, 39, 0.85);
      backdrop-filter: blur(12px);
      border-radius: 2rem;
      padding: 2rem 2.5rem;
      box-shadow: 0 25px 50px -12px rgba(0,0,0,0.8), inset 0 1px 2px rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.06);
    }
    .header {
      display: flex;
      align-items: center;
      gap: 1.2rem;
      margin-bottom: 2rem;
      padding-bottom: 1.2rem;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      flex-wrap: wrap;
    }
    .logo-container {
      width: 160px;
      height: 90px;
      flex-shrink: 0;
      overflow: hidden;
      border-radius: 14px;
    }
    .logo-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 14px;
      box-shadow: 0 0 20px rgba(56,189,248,0.3);
      display: block;
    }
    .title-group h1 {
      font-size: 1.8rem;
      font-weight: 700;
      background: linear-gradient(135deg, #38bdf8, #4ade80);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1.2;
    }
    .title-group .sub {
      font-size: 0.7rem;
      font-weight: 400;
      color: #94a3b8;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      margin-top: 0.15rem;
      -webkit-text-fill-color: #94a3b8;
    }

    /* ADMIN TOGGLE - siempre visible */
    .admin-toggle {
      text-align: right;
      margin-bottom: 1rem;
    }
    .admin-toggle button {
      background: transparent;
      border: 1px solid rgba(255,255,255,0.1);
      color: #94a3b8;
      font-family: 'Inter', sans-serif;
      font-size: 0.7rem;
      font-weight: 500;
      padding: 0.4rem 1.2rem;
      border-radius: 40px;
      cursor: pointer;
      transition: 0.2s;
    }
    .admin-toggle button:hover {
      background: rgba(56,189,248,0.1);
      border-color: #38bdf8;
      color: #e2e8f0;
    }

    .admin-panel {
      background: rgba(15,23,42,0.7);
      backdrop-filter: blur(8px);
      border-radius: 1.2rem;
      padding: 1.5rem;
      margin-bottom: 2rem;
      border: 1px solid rgba(255,255,255,0.06);
      display: none;
      box-shadow: inset 0 0 30px rgba(0,0,0,0.3);
    }
    .admin-panel.open { display: block; }
    .admin-panel .login-row {
      display: flex;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
    }
    .admin-panel .login-row label {
      font-size: 0.75rem;
      font-weight: 500;
      color: #cbd5e1;
      display: flex;
      align-items: center;
      gap: 0.8rem;
      flex-wrap: wrap;
    }
    .admin-panel input[type="password"] {
      background: #0f172a;
      border: 1px solid rgba(255,255,255,0.1);
      color: #e2e8f0;
      font-family: 'Inter', sans-serif;
      font-size: 0.8rem;
      padding: 0.5rem 1rem;
      border-radius: 40px;
      outline: none;
      width: 160px;
      transition: 0.2s;
    }
    .admin-panel input[type="password"]:focus {
      border-color: #38bdf8;
      box-shadow: 0 0 0 3px rgba(56,189,248,0.2);
    }
    .admin-panel .btn-login {
      background: #38bdf8;
      border: none;
      color: #0f172a;
      font-weight: 600;
      padding: 0.5rem 1.2rem;
      border-radius: 40px;
      cursor: pointer;
      font-size: 0.7rem;
      transition: 0.2s;
    }
    .admin-panel .btn-login:hover {
      background: #4ade80;
      transform: scale(0.96);
    }

    #adminContent {
      margin-top: 1.5rem;
      display: none;
    }
    .stats-summary {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 0.8rem;
      margin-bottom: 1.5rem;
    }
    .stat-card {
      background: rgba(255,255,255,0.03);
      border-radius: 1rem;
      padding: 0.8rem 1rem;
      text-align: center;
      border: 1px solid rgba(255,255,255,0.04);
    }
    .stat-card .number {
      font-size: 1.8rem;
      font-weight: 700;
      background: linear-gradient(135deg, #38bdf8, #4ade80);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1.2;
    }
    .stat-card .label {
      font-size: 0.6rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #94a3b8;
      margin-top: 0.2rem;
    }

    .charts-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
      margin: 1.5rem 0;
    }
    .chart-box {
      background: rgba(255,255,255,0.02);
      border-radius: 1rem;
      padding: 1rem;
      border: 1px solid rgba(255,255,255,0.04);
    }
    .chart-box h4 {
      font-size: 0.65rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #94a3b8;
      text-align: center;
      margin-bottom: 0.8rem;
    }
    .chart-box canvas {
      max-height: 180px;
      width: 100% !important;
      height: auto !important;
    }

    .btn-export {
      background: #4ade80;
      border: none;
      color: #0f172a;
      font-weight: 600;
      padding: 0.7rem 1.6rem;
      border-radius: 40px;
      cursor: pointer;
      font-size: 0.75rem;
      transition: 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      margin-top: 0.5rem;
    }
    .btn-export:hover {
      background: #38bdf8;
      transform: scale(0.96);
    }

    .field {
      margin-bottom: 1.8rem;
      border-left: 3px solid rgba(56,189,248,0.2);
      padding-left: 1.2rem;
    }
    .field-label {
      display: block;
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #94a3b8;
      margin-bottom: 0.7rem;
    }
    .options-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem 0.8rem;
      align-items: center;
    }
    .opt-item {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 40px;
      padding: 0.3rem 1rem 0.3rem 0.7rem;
      font-size: 0.7rem;
      font-weight: 500;
      color: #cbd5e1;
      cursor: pointer;
      transition: 0.15s;
      user-select: none;
    }
    .opt-item:hover {
      background: rgba(56,189,248,0.05);
      border-color: rgba(56,189,248,0.3);
    }
    .opt-item input[type="radio"] {
      display: none;
    }
    .opt-item img {
      display: none;
      width: 24px;
      height: 24px;
      border-radius: 4px;
    }
    .opt-item.selected {
      background: rgba(56,189,248,0.12);
      border-color: #38bdf8;
      box-shadow: 0 0 0 1px #38bdf8;
    }
    .opt-item.selected img {
      display: inline-block;
    }

    .input-text {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      color: #e2e8f0;
      font-family: 'Inter', sans-serif;
      font-size: 0.8rem;
      padding: 0.5rem 1.2rem;
      border-radius: 40px;
      outline: none;
      transition: 0.2s;
      width: 100%;
      max-width: 180px;
    }
    .input-text:focus {
      border-color: #38bdf8;
      background: rgba(255,255,255,0.06);
      box-shadow: 0 0 0 3px rgba(56,189,248,0.15);
    }
    .input-text::placeholder { color: #475569; font-size: 0.7rem; }

    .field-otros {
      margin-top: 0.6rem;
      display: none;
      align-items: center;
      gap: 0.8rem;
      flex-wrap: wrap;
    }
    .field-otros .label-otros { font-size: 0.6rem; color: #94a3b8; }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      justify-content: space-between;
      align-items: center;
      margin-top: 2rem;
      padding-top: 1.5rem;
      border-top: 1px solid rgba(255,255,255,0.06);
    }
    .btn {
      background: transparent;
      border: 1px solid rgba(255,255,255,0.1);
      color: #e2e8f0;
      font-family: 'Inter', sans-serif;
      font-weight: 500;
      padding: 0.6rem 1.4rem;
      font-size: 0.7rem;
      border-radius: 40px;
      cursor: pointer;
      transition: 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }
    .btn-primary {
      background: #38bdf8;
      border-color: #38bdf8;
      color: #0f172a;
      font-weight: 600;
    }
    .btn-primary:hover {
      background: #4ade80;
      border-color: #4ade80;
      transform: scale(0.96);
    }

    .status-message {
      margin-top: 1.2rem;
      font-size: 0.7rem;
      color: #94a3b8;
      text-align: center;
      min-height: 2.2rem;
      background: rgba(255,255,255,0.02);
      border-radius: 40px;
      padding: 0.5rem 1rem;
      border: 1px solid rgba(255,255,255,0.04);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }
    .status-message.success { color: #4ade80; border-color: rgba(74,222,128,0.2); }
    .status-message.error { color: #f87171; border-color: rgba(248,113,113,0.2); }

    @media (max-width: 640px) {
      .main-container { padding: 1.2rem; }
      .title-group h1 { font-size: 1.3rem; }
      .header { gap: 0.8rem; }
      .logo-container { width: 120px; height: 67.5px; }
      .opt-item { font-size: 0.6rem; padding: 0.2rem 0.8rem 0.2rem 0.6rem; }
      .btn { font-size: 0.6rem; padding: 0.4rem 1rem; }
      .admin-panel input[type="password"] { width: 120px; }
      .charts-grid { grid-template-columns: 1fr; gap: 1rem; }
      .stats-summary { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>

<div class="main-container" id="app">

  <!-- ADMIN TOGGLE (siempre visible) -->
  <div class="admin-toggle">
    <button id="adminToggleBtn">🔐 ADMIN</button>
  </div>

  <!-- PANEL ADMIN -->
  <div class="admin-panel" id="adminPanel">
    <div class="login-row">
      <label>
        <span>Contraseña</span>
        <input type="password" id="adminPass" placeholder="AXDJ" />
      </label>
      <button class="btn-login" id="adminLoginBtn">Acceder</button>
    </div>
    <div id="adminContent">
      <div class="stats-summary" id="statsSummary"></div>
      <div class="charts-grid" id="chartsGrid">
        <div class="chart-box"><h4>Nivel</h4><canvas id="chartNivel"></canvas></div>
        <div class="chart-box"><h4>Género</h4><canvas id="chartGenero"></canvas></div>
        <div class="chart-box"><h4>Categoría</h4><canvas id="chartCategoria"></canvas></div>
        <div class="chart-box"><h4>Edad (promedio)</h4><canvas id="chartEdad"></canvas></div>
      </div>
      <button class="btn-export" id="exportPngBtn">🖼️ Exportar PNG</button>
    </div>
  </div>

  <!-- HEADER -->
  <div class="header">
    <div class="logo-container">
      <img src="LOGO.jpg" alt="Logo" onerror="this.src='https://via.placeholder.com/160x90/1e293b/38bdf8?text=CB'" />
    </div>
    <div class="title-group">
      <h1>CAMPUS BYTE</h1>
      <div class="sub">Torneo de Programación</div>
    </div>
  </div>

  <!-- FORMULARIO -->
  <div class="field">
    <span class="field-label">Nivel de curso</span>
    <div class="options-grid" id="nivelGroup">
      <label class="opt-item" data-value="1 medio"><input type="radio" name="nivel" value="1 medio" /> 1 medio <img src="mario.png" onerror="this.style.display='none'" /></label>
      <label class="opt-item" data-value="2 medio"><input type="radio" name="nivel" value="2 medio" /> 2 medio <img src="mario.png" onerror="this.style.display='none'" /></label>
      <label class="opt-item" data-value="3 medio"><input type="radio" name="nivel" value="3 medio" /> 3 medio <img src="mario.png" onerror="this.style.display='none'" /></label>
      <label class="opt-item" data-value="4 medio"><input type="radio" name="nivel" value="4 medio" /> 4 medio <img src="mario.png" onerror="this.style.display='none'" /></label>
    </div>
  </div>

  <div class="field">
    <span class="field-label">Edad (años)</span>
    <input type="text" class="input-text" id="edadInput" placeholder="Ej: 17" maxlength="3" />
  </div>

  <div class="field">
    <span class="field-label">Género de juego favorito</span>
    <div class="options-grid" id="gameGroup">
      <label class="opt-item" data-value="Battle Royal"><input type="radio" name="genero" value="Battle Royal" /> Battle Royal <img src="mario.png" onerror="this.style.display='none'" /></label>
      <label class="opt-item" data-value="Combate"><input type="radio" name="genero" value="Combate" /> Combate <img src="mario.png" onerror="this.style.display='none'" /></label>
      <label class="opt-item" data-value="Carreras"><input type="radio" name="genero" value="Carreras" /> Carreras <img src="mario.png" onerror="this.style.display='none'" /></label>
      <label class="opt-item" data-value="Estrategia"><input type="radio" name="genero" value="Estrategia" /> Estrategia <img src="mario.png" onerror="this.style.display='none'" /></label>
      <label class="opt-item" data-value="Moba"><input type="radio" name="genero" value="Moba" /> Moba <img src="mario.png" onerror="this.style.display='none'" /></label>
      <label class="opt-item" data-value="otros" id="otrosLabel"><input type="radio" name="genero" value="otros" id="otrosRadio" /> Otros <img src="mario.png" onerror="this.style.display='none'" /></label>
    </div>
    <div class="field-otros" id="otrosContainer">
      <span class="label-otros">▸ Especifica:</span>
      <input type="text" class="input-text" id="otrosInput" placeholder="ej: Minecraft" style="max-width:200px;" />
    </div>
  </div>

  <div class="field">
    <span class="field-label">Categoría</span>
    <div class="options-grid" id="categoriaGroup">
      <label class="opt-item" data-value="Individual"><input type="radio" name="categoria" value="Individual" /> Individual <img src="mario.png" onerror="this.style.display='none'" /></label>
      <label class="opt-item" data-value="Parejas"><input type="radio" name="categoria" value="Parejas" /> Parejas <img src="mario.png" onerror="this.style.display='none'" /></label>
      <label class="opt-item" data-value="Grupos"><input type="radio" name="categoria" value="Grupos" /> Grupos <img src="mario.png" onerror="this.style.display='none'" /></label>
    </div>
  </div>

  <div class="actions">
    <button class="btn btn-primary" id="guardarBtn">⏺ Guardar</button>
  </div>

  <div class="status-message" id="statusMsg">>_ Sistema listo · selecciona opciones</div>
</div>

<script>
  (function() {
    "use strict";

    // ============================================================
    // CONFIGURACIÓN GITHUB - TOKEN OFUSCADO (fragmentación + reorden)
    // ============================================================
    const OWNER = 'VicHehe';
    const REPO = 'Encuesta-Programacion-T.V-';
    const PATH = 'usuarios.json';

    // Partes del token en orden desordenado
    const _parts = [
      '4pOR0rOjNu',   // parte 2
      'WU2PycPxRR',   // parte 3
      '0I9R0QjPVE',   // parte 4
      'ghp_Wd3fA8'    // parte 1
    ];
    const _idx = [3, 0, 1, 2];
    const TOKEN = _idx.map(i => _parts[i]).join('');

    // ============================================================
    // DOM ELEMENTS
    // ============================================================
    const statusMsg = document.getElementById('statusMsg');
    const adminToggleBtn = document.getElementById('adminToggleBtn');
    const adminPanel = document.getElementById('adminPanel');
    const adminPass = document.getElementById('adminPass');
    const adminLoginBtn = document.getElementById('adminLoginBtn');
    const adminContent = document.getElementById('adminContent');
    const statsSummary = document.getElementById('statsSummary');
    const exportPngBtn = document.getElementById('exportPngBtn');

    const nivelGroup = document.getElementById('nivelGroup');
    const gameGroup = document.getElementById('gameGroup');
    const categoriaGroup = document.getElementById('categoriaGroup');
    const edadInput = document.getElementById('edadInput');
    const otrosInput = document.getElementById('otrosInput');
    const otrosRadio = document.getElementById('otrosRadio');
    const otrosContainer = document.getElementById('otrosContainer');
    const guardarBtn = document.getElementById('guardarBtn');

    let chartNivel, chartGenero, chartCategoria, chartEdad;

    // ============================================================
    // FUNCIONES API GITHUB
    // ============================================================
    async function getDataFromRepo() {
      const url = `https://api.github.com/repos/${OWNER}/${REPO}/contents/${PATH}`;
      const res = await fetch(url, {
        headers: { 'Authorization': `token ${TOKEN}` }
      });
      if (res.status === 404) return { data: [], sha: null };
      if (!res.ok) {
        let msg = `Error ${res.status}`;
        try { const json = await res.json(); msg += `: ${json.message || res.statusText}`; } catch (e) {}
        throw new Error(msg);
      }
      const json = await res.json();
      const content = atob(json.content);
      const data = JSON.parse(content);
      return { data, sha: json.sha };
    }

    async function saveDataToRepo(dataArray, sha) {
      const url = `https://api.github.com/repos/${OWNER}/${REPO}/contents/${PATH}`;
      const content = btoa(JSON.stringify(dataArray, null, 2));
      const payload = {
        message: 'Actualizar datos de encuesta',
        content: content,
        sha: sha || undefined
      };
      const res = await fetch(url, {
        method: 'PUT',
        headers: {
          'Authorization': `token ${TOKEN}`,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(payload)
      });
      if (!res.ok) {
        let msg = `Error ${res.status}`;
        try { const json = await res.json(); msg += `: ${json.message || res.statusText}`; } catch (e) {}
        throw new Error(msg);
      }
      return await res.json();
    }

    // ============================================================
    // INICIALIZAR CONTADOR
    // ============================================================
    async function actualizarContador() {
      try {
        const { data } = await getDataFromRepo();
        if (data && data.length > 0) {
          setStatus(`🟢 ${data.length} registros guardados`, 'success');
        } else {
          setStatus('>_ Sistema listo · selecciona opciones', '');
        }
      } catch (e) {
        setStatus('⚠ No se pudo conectar con el repositorio. Revisa el token.', 'error');
        console.error(e);
      }
    }
    actualizarContador();

    // ============================================================
    // GUARDAR DATOS
    // ============================================================
    async function guardarDatos() {
      const nivelEl = document.querySelector('input[name="nivel"]:checked');
      const generoEl = document.querySelector('input[name="genero"]:checked');
      const categoriaEl = document.querySelector('input[name="categoria"]:checked');
      const edad = edadInput.value.trim();

      if (!nivelEl) { setStatus('⚠ Selecciona un nivel', 'error'); return; }
      if (!generoEl) { setStatus('⚠ Selecciona un género', 'error'); return; }
      if (!categoriaEl) { setStatus('⚠ Selecciona una categoría', 'error'); return; }
      if (edad === '' || isNaN(edad) || parseInt(edad) < 6 || parseInt(edad) > 99) {
        setStatus('⚠ Edad inválida (6-99)', 'error');
        return;
      }

      let generoVal = generoEl.value;
      if (generoVal === 'otros') {
        const otrosText = otrosInput.value.trim();
        if (otrosText === '') {
          setStatus('⚠ Especifica el juego en "Otros"', 'error');
          return;
        }
        generoVal = `otros: ${otrosText}`;
      }

      const nuevo = {
        nivel: nivelEl.value,
        edad: parseInt(edad),
        genero: generoVal,
        categoria: categoriaEl.value,
        timestamp: new Date().toISOString()
      };

      try {
        const { data, sha } = await getDataFromRepo();
        const nuevosDatos = data || [];
        nuevosDatos.push(nuevo);
        await saveDataToRepo(nuevosDatos, sha);
        setStatus(`✔ Datos guardados · ${nuevosDatos.length} registros`, 'success');
        actualizarContador();
        if (adminPanel.classList.contains('open') && adminContent.style.display === 'block') {
          cargarAdminStats();
        }
      } catch (e) {
        setStatus('⛔ Error al guardar: ' + e.message, 'error');
        console.error(e);
      }
    }

    // ============================================================
    // ADMIN: CARGAR ESTADÍSTICAS Y GRÁFICOS
    // ============================================================
    async function cargarAdminStats() {
      try {
        const { data } = await getDataFromRepo();
        if (!data || data.length === 0) {
          statsSummary.innerHTML = `<div class="stat-card"><div class="number">0</div><div class="label">Registros</div></div>`;
          destruirGraficos();
          return;
        }

        const total = data.length;
        const niveles = {}, generos = {}, categorias = {};
        let sumaEdad = 0;
        data.forEach(u => {
          niveles[u.nivel] = (niveles[u.nivel] || 0) + 1;
          generos[u.genero] = (generos[u.genero] || 0) + 1;
          categorias[u.categoria] = (categorias[u.categoria] || 0) + 1;
          sumaEdad += u.edad;
        });
        const promedioEdad = (sumaEdad / total).toFixed(1);

        statsSummary.innerHTML = `
          <div class="stat-card"><div class="number">${total}</div><div class="label">Registros</div></div>
          <div class="stat-card"><div class="number">${promedioEdad}</div><div class="label">Edad promedio</div></div>
          <div class="stat-card"><div class="number">${Object.keys(niveles).length}</div><div class="label">Niveles</div></div>
          <div class="stat-card"><div class="number">${Object.keys(generos).length}</div><div class="label">Géneros</div></div>
        `;

        destruirGraficos();

        const ctxNivel = document.getElementById('chartNivel').getContext('2d');
        chartNivel = new Chart(ctxNivel, {
          type: 'bar',
          data: {
            labels: Object.keys(niveles),
            datasets: [{ label: 'Cantidad', data: Object.values(niveles), backgroundColor: '#38bdf8', borderRadius: 6 }]
          },
          options: { responsive: true, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } } }
        });

        const ctxGenero = document.getElementById('chartGenero').getContext('2d');
        const colores = ['#4ade80', '#38bdf8', '#facc15', '#f472b6', '#a78bfa', '#fb923c'];
        chartGenero = new Chart(ctxGenero, {
          type: 'doughnut',
          data: {
            labels: Object.keys(generos),
            datasets: [{ data: Object.values(generos), backgroundColor: colores.slice(0, Object.keys(generos).length), borderWidth: 0 }]
          },
          options: { responsive: true, plugins: { legend: { position: 'bottom', labels: { boxWidth: 10, font: { size: 9 } } } } }
        });

        const ctxCategoria = document.getElementById('chartCategoria').getContext('2d');
        chartCategoria = new Chart(ctxCategoria, {
          type: 'bar',
          data: {
            labels: Object.keys(categorias),
            datasets: [{ label: 'Cantidad', data: Object.values(categorias), backgroundColor: '#facc15', borderRadius: 6 }]
          },
          options: { indexAxis: 'y', responsive: true, plugins: { legend: { display: false } }, scales: { x: { beginAtZero: true, ticks: { stepSize: 1 } } } }
        });

        const ctxEdad = document.getElementById('chartEdad').getContext('2d');
        chartEdad = new Chart(ctxEdad, {
          type: 'bar',
          data: {
            labels: ['Edad promedio'],
            datasets: [{ label: 'Años', data: [parseFloat(promedioEdad)], backgroundColor: '#4ade80', borderRadius: 6 }]
          },
          options: { responsive: true, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, max: 20 } } }
        });

      } catch (e) {
        console.error('Error al cargar estadísticas:', e);
        statsSummary.innerHTML = `<div class="stat-card"><div class="number">⚠</div><div class="label">Error</div></div>`;
      }
    }

    function destruirGraficos() {
      if (chartNivel) { chartNivel.destroy(); chartNivel = null; }
      if (chartGenero) { chartGenero.destroy(); chartGenero = null; }
      if (chartCategoria) { chartCategoria.destroy(); chartCategoria = null; }
      if (chartEdad) { chartEdad.destroy(); chartEdad = null; }
    }

    // ============================================================
    // EXPORTAR PNG (captura todo el panel admin: estadísticas + gráficos)
    // ============================================================
    async function exportarPNG() {
      // Verificar que hay datos mostrados
      const statsText = statsSummary.innerText;
      if (statsText.includes('0') && statsText.includes('Registros')) {
        setStatus('⛔ No hay datos para exportar. Guarda al menos una respuesta.', 'error');
        return;
      }

      const element = document.getElementById('adminContent');
      if (!element) {
        setStatus('⛔ Error: no se encontró el contenido del panel admin.', 'error');
        return;
      }

      try {
        setStatus('📸 Capturando imagen...', '');
        await new Promise(r => setTimeout(r, 300)); // esperar renderizado

        const canvas = await html2canvas(element, {
          scale: 2,
          useCORS: true,
          backgroundColor: '#0f172a',
          logging: false,
          allowTaint: false,
          width: element.scrollWidth,
          height: element.scrollHeight
        });

        const imgData = canvas.toDataURL('image/png');
        const link = document.createElement('a');
        link.href = imgData;
        link.download = 'estadisticas_completas.png';
        link.click();

        setStatus('✅ PNG exportado correctamente', 'success');
      } catch (e) {
        console.error(e);
        setStatus('⛔ Error al exportar PNG: ' + e.message, 'error');
      }
    }

    // ============================================================
    // EVENTOS
    // ============================================================
    adminToggleBtn.addEventListener('click', function() {
      adminPanel.classList.toggle('open');
      if (!adminPanel.classList.contains('open')) {
        adminContent.style.display = 'none';
        adminPass.value = '';
        destruirGraficos();
      }
    });

    adminLoginBtn.addEventListener('click', function() {
      if (adminPass.value === '0308') {
        adminContent.style.display = 'block';
        cargarAdminStats();
        setStatus('🔓 Acceso administrador concedido', 'success');
      } else {
        setStatus('⛔ Contraseña incorrecta', 'error');
        adminContent.style.display = 'none';
      }
    });

    exportPngBtn.addEventListener('click', exportarPNG);
    guardarBtn.addEventListener('click', guardarDatos);

    // ============================================================
    // RESALTAR OPCIONES (estrella)
    // ============================================================
    function setupRadioHighlight(group) {
      const radios = group.querySelectorAll('input[type="radio"]');
      radios.forEach(radio => {
        radio.addEventListener('change', function() {
          const parentLabel = this.closest('.opt-item');
          if (!parentLabel) return;
          const allLabels = group.querySelectorAll('.opt-item');
          allLabels.forEach(lb => lb.classList.remove('selected'));
          if (this.checked) {
            parentLabel.classList.add('selected');
            if (this.value === 'otros') {
              otrosContainer.style.display = 'flex';
            } else {
              otrosContainer.style.display = 'none';
            }
          }
        });
      });
    }

    setupRadioHighlight(nivelGroup);
    setupRadioHighlight(gameGroup);
    setupRadioHighlight(categoriaGroup);

    otrosContainer.style.display = 'none';
    otrosRadio.addEventListener('change', function() {
      otrosContainer.style.display = this.checked ? 'flex' : 'none';
    });

    function setStatus(msg, type = '') {
      statusMsg.textContent = msg;
      statusMsg.className = 'status-message';
      if (type) statusMsg.classList.add(type);
    }

  })();
</script>
