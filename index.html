<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>◈ CAMPUS BYTE · INSCRIPCIÓN</title>
  <!-- Fuente pixel -->
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <!-- html2pdf (para exportar PDF) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js" integrity="sha512-GsLlZN/3F2ErC5ifS5QtgpiJtWd43JWSuIgh7mbzZ8zBps+dvLusV+eNQATqgA/HdeKFVgA5v3S/cIrLF7QnIg==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <style>
    /* ===== RESET Y BASE ===== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: #0b0e0b;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Press Start 2P', monospace;
      padding: 1.5rem;
      background-image: 
        radial-gradient(circle at 20% 30%, #1a3a1a 0%, #0a0f0a 80%),
        repeating-linear-gradient(45deg, #0f1f0f 0px, #0f1f0f 2px, #0b0e0b 2px, #0b0e0b 8px);
      image-rendering: pixelated;
    }

    /* ===== CONTENEDOR PRINCIPAL ===== */
    .main-container {
      max-width: 860px;
      width: 100%;
      background: rgba(10, 20, 10, 0.85);
      backdrop-filter: blur(4px);
      border: 3px solid #33ff33;
      box-shadow: 0 0 40px #33ff3340, inset 0 0 30px #33ff3310;
      border-radius: 28px;
      padding: 2rem 2.2rem;
      position: relative;
      transition: 0.3s;
    }

    /* ===== HEADER CON LOGO Y TÍTULO ===== */
    .header {
      display: flex;
      align-items: center;
      gap: 1.2rem;
      margin-bottom: 1.8rem;
      flex-wrap: wrap;
      border-bottom: 2px solid #2f5f2f;
      padding-bottom: 1.2rem;
    }

    .logo-container {
      flex-shrink: 0;
    }

    .logo-container img {
      height: 60px;
      width: auto;
      image-rendering: pixelated;
      filter: drop-shadow(0 0 12px #33ff3380);
      border-radius: 12px;
    }

    .title-group h1 {
      font-size: 1.6rem;
      letter-spacing: 3px;
      color: #b0ffb0;
      text-shadow: 0 0 12px #33ff33, 0 0 30px #33ff33aa;
      line-height: 1.4;
    }

    .title-group .sub {
      font-size: 0.6rem;
      color: #7fbf7f;
      letter-spacing: 2px;
      margin-top: 0.2rem;
    }

    /* ===== ADMIN ACCESO ===== */
    .admin-toggle {
      text-align: right;
      margin-bottom: 0.5rem;
    }

    .admin-toggle button {
      background: transparent;
      border: 2px solid #2f5f2f;
      color: #6f9f6f;
      font-family: 'Press Start 2P', monospace;
      font-size: 0.5rem;
      padding: 0.4rem 1rem;
      border-radius: 30px;
      cursor: pointer;
      transition: 0.2s;
    }

    .admin-toggle button:hover {
      background: #1f3f1f;
      color: #bbffbb;
      border-color: #55ff55;
    }

    .admin-panel {
      background: #0f1a0f;
      border: 2px solid #33ff3370;
      border-radius: 16px;
      padding: 1.5rem;
      margin-top: 1rem;
      margin-bottom: 1.8rem;
      display: none;
      box-shadow: inset 0 0 30px #33ff3310;
    }

    .admin-panel.open {
      display: block;
    }

    .admin-panel label {
      font-size: 0.6rem;
      color: #b6fbb6;
      display: flex;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .admin-panel input[type="password"] {
      background: #0b130b;
      border: 2px solid #2f5f2f;
      color: #bbffbb;
      font-family: 'Press Start 2P', monospace;
      font-size: 0.6rem;
      padding: 0.5rem 1rem;
      border-radius: 30px;
      outline: none;
      width: 160px;
    }

    .admin-panel input[type="password"]:focus {
      border-color: #55ff55;
      box-shadow: 0 0 16px #33ff3360;
    }

    .admin-panel .stats-area {
      margin-top: 1.2rem;
      font-size: 0.55rem;
      color: #9fcf9f;
      line-height: 1.8;
      max-height: 200px;
      overflow-y: auto;
      background: #0b130b;
      padding: 0.8rem;
      border-radius: 12px;
      border: 1px solid #2f5f2f;
    }

    .admin-panel .stats-area pre {
      font-family: 'Press Start 2P', monospace;
      font-size: 0.5rem;
      white-space: pre-wrap;
      word-break: break-all;
      color: #b0e0b0;
    }

    .admin-panel .btn-pdf {
      background: #1f3f1f;
      border: 2px solid #88ff88;
      color: #bbffbb;
      font-family: 'Press Start 2P', monospace;
      font-size: 0.55rem;
      padding: 0.6rem 1.2rem;
      border-radius: 40px;
      cursor: pointer;
      margin-top: 1rem;
      transition: 0.2s;
    }

    .admin-panel .btn-pdf:hover {
      background: #88ff88;
      color: #0a1a0a;
      box-shadow: 0 0 30px #88ff88aa;
    }

    /* ===== PREGUNTAS ===== */
    .field {
      margin-bottom: 2rem;
      border-left: 4px solid #33ff3360;
      padding-left: 1.2rem;
    }

    .field-label {
      display: block;
      font-size: 0.75rem;
      color: #c6f7c6;
      text-shadow: 0 0 8px #33ff3370;
      margin-bottom: 0.9rem;
      letter-spacing: 1.5px;
    }

    .options-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 0.8rem 1.2rem;
      align-items: center;
    }

    .opt-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      background: #142014;
      border: 2px solid #2a4a2a;
      border-radius: 40px;
      padding: 0.4rem 1rem 0.4rem 0.8rem;
      font-size: 0.6rem;
      color: #b0e0b0;
      cursor: pointer;
      transition: 0.15s;
      box-shadow: inset 0 0 8px #0f1f0f;
    }

    .opt-item:hover {
      background: #1e3a1e;
      border-color: #55ff55;
      transform: scale(1.02);
    }

    .opt-item input[type="radio"],
    .opt-item input[type="checkbox"] {
      accent-color: #33ff33;
      width: 16px;
      height: 16px;
      filter: drop-shadow(0 0 4px #33ff33);
      cursor: pointer;
    }

    .opt-item img {
      width: 28px;
      height: 28px;
      image-rendering: pixelated;
      margin-left: 2px;
      filter: drop-shadow(0 0 6px #33ff3380);
      display: none; /* solo se muestra cuando está seleccionado */
    }

    .opt-item.selected {
      background: #1f3f1f;
      border-color: #77ff77;
      box-shadow: 0 0 20px #33ff3370, inset 0 0 12px #33ff3330;
    }

    .opt-item.selected img {
      display: inline-block;
    }

    .input-text {
      background: #0f1a0f;
      border: 2px solid #2f5f2f;
      color: #bbffbb;
      font-family: 'Press Start 2P', monospace;
      font-size: 0.65rem;
      padding: 0.5rem 1.2rem;
      border-radius: 40px;
      outline: none;
      transition: 0.2s;
      width: 100%;
      max-width: 200px;
    }

    .input-text:focus {
      border-color: #55ff55;
      box-shadow: 0 0 16px #33ff3360;
      background: #142014;
    }

    .input-text::placeholder {
      color: #3f6f3f;
      font-size: 0.5rem;
    }

    .field-otros {
      margin-top: 0.8rem;
      display: flex;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .otros-hidden {
      display: none;
    }

    .otros-visible {
      display: flex;
      align-items: center;
      gap: 0.8rem;
    }

    /* ===== BOTONES GUARDAR ===== */
    .actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      margin-top: 1.8rem;
      border-top: 2px solid #2f5f2f;
      padding-top: 1.8rem;
    }

    .btn {
      font-family: 'Press Start 2P', monospace;
      background: #1f331f;
      border: 3px solid #33ff33;
      color: #bbffbb;
      padding: 0.7rem 1.6rem;
      font-size: 0.65rem;
      border-radius: 60px;
      cursor: pointer;
      box-shadow: 0 0 12px #33ff3340;
      transition: 0.2s;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .btn:hover {
      background: #33ff33;
      color: #0f1f0f;
      box-shadow: 0 0 30px #33ff33aa;
      transform: scale(0.96);
    }

    .btn:active {
      transform: scale(0.92);
    }

    .status-message {
      margin-top: 1.2rem;
      font-size: 0.55rem;
      color: #7fbf7f;
      text-align: center;
      min-height: 2.5rem;
      border: 1px dashed #2f5f2f;
      padding: 0.6rem;
      background: #0f1a0f70;
      border-radius: 30px;
      letter-spacing: 0.5px;
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 600px) {
      .main-container { padding: 1rem; }
      .title-group h1 { font-size: 1.2rem; }
      .header { gap: 0.8rem; }
      .logo-container img { height: 40px; }
      .opt-item { font-size: 0.5rem; padding: 0.3rem 0.7rem; }
      .btn { font-size: 0.5rem; padding: 0.5rem 1rem; }
      .admin-panel input[type="password"] { width: 120px; }
    }
  </style>
</head>
<body>
  <div class="main-container" id="app">

    <!-- ADMIN TOGGLE -->
    <div class="admin-toggle">
      <button id="adminToggleBtn">🔐 ADMIN</button>
    </div>

    <!-- PANEL ADMIN (oculto) -->
    <div class="admin-panel" id="adminPanel">
      <label>
        <span>CONTRASEÑA:</span>
        <input type="password" id="adminPass" placeholder="0308">
        <button class="btn" style="padding:0.3rem 1rem; font-size:0.5rem;" id="adminLoginBtn">ACCEDER</button>
      </label>
      <div id="adminContent" style="display:none;">
        <div class="stats-area" id="statsDisplay">
          <pre>Cargando estadísticas...</pre>
        </div>
        <button class="btn-pdf" id="exportPdfBtn">📄 EXPORTAR PDF</button>
      </div>
    </div>

    <!-- HEADER -->
    <div class="header">
      <div class="logo-container">
        <!-- LOGO.jpg (ruta local) -->
        <img src="LOGO.jpg" alt="Logo especialidad" onerror="this.src='https://via.placeholder.com/60x60/1a3a1a/33ff33?text=LOGO'">
      </div>
      <div class="title-group">
        <h1>⧩ CAMPUS BYTE</h1>
        <div class="sub">// TORNEO DE PROGRAMACIÓN //</div>
      </div>
    </div>

    <!-- CUESTIONARIO -->
    <!-- NIVEL -->
    <div class="field">
      <span class="field-label">⏣ NIVEL DE CURSO</span>
      <div class="options-grid" id="nivelGroup">
        <label class="opt-item" data-value="1 medio">
          <input type="radio" name="nivel" value="1 medio"> 1 medio
          <img src="Cliparts-de-Mario-Bros-PNG+(67).png" alt="mario" onerror="this.src='https://www.pngall.com/wp-content/uploads/2016/06/Mario-PNG-Image.png'">
        </label>
        <label class="opt-item" data-value="2 medio">
          <input type="radio" name="nivel" value="2 medio"> 2 medio
          <img src="Cliparts-de-Mario-Bros-PNG+(67).png" alt="mario" onerror="this.src='https://www.pngall.com/wp-content/uploads/2016/06/Mario-PNG-Image.png'">
        </label>
        <label class="opt-item" data-value="3 medio">
          <input type="radio" name="nivel" value="3 medio"> 3 medio
          <img src="Cliparts-de-Mario-Bros-PNG+(67).png" alt="mario" onerror="this.src='https://www.pngall.com/wp-content/uploads/2016/06/Mario-PNG-Image.png'">
        </label>
        <label class="opt-item" data-value="4 medio">
          <input type="radio" name="nivel" value="4 medio"> 4 medio
          <img src="Cliparts-de-Mario-Bros-PNG+(67).png" alt="mario" onerror="this.src='https://www.pngall.com/wp-content/uploads/2016/06/Mario-PNG-Image.png'">
        </label>
      </div>
    </div>

    <!-- EDAD -->
    <div class="field">
      <span class="field-label">⏣ EDAD (años)</span>
      <input type="text" class="input-text" id="edadInput" placeholder="EJ: 17" maxlength="3">
    </div>

    <!-- GÉNERO -->
    <div class="field">
      <span class="field-label">⏣ GÉNERO DE JUEGO FAV</span>
      <div class="options-grid" id="gameGroup">
        <label class="opt-item" data-value="Battle Royal">
          <input type="radio" name="genero" value="Battle Royal"> Battle Royal
          <img src="Cliparts-de-Mario-Bros-PNG+(67).png" alt="mario" onerror="this.src='https://www.pngall.com/wp-content/uploads/2016/06/Mario-PNG-Image.png'">
        </label>
        <label class="opt-item" data-value="Combate">
          <input type="radio" name="genero" value="Combate"> Combate
          <img src="Cliparts-de-Mario-Bros-PNG+(67).png" alt="mario" onerror="this.src='https://www.pngall.com/wp-content/uploads/2016/06/Mario-PNG-Image.png'">
        </label>
        <label class="opt-item" data-value="Carreras">
          <input type="radio" name="genero" value="Carreras"> Carreras
          <img src="Cliparts-de-Mario-Bros-PNG+(67).png" alt="mario" onerror="this.src='https://www.pngall.com/wp-content/uploads/2016/06/Mario-PNG-Image.png'">
        </label>
        <label class="opt-item" data-value="Estrategia">
          <input type="radio" name="genero" value="Estrategia"> Estrategia
          <img src="Cliparts-de-Mario-Bros-PNG+(67).png" alt="mario" onerror="this.src='https://www.pngall.com/wp-content/uploads/2016/06/Mario-PNG-Image.png'">
        </label>
        <label class="opt-item" data-value="Moba">
          <input type="radio" name="genero" value="Moba"> Moba
          <img src="Cliparts-de-Mario-Bros-PNG+(67).png" alt="mario" onerror="this.src='https://www.pngall.com/wp-content/uploads/2016/06/Mario-PNG-Image.png'">
        </label>
        <label class="opt-item" data-value="otros" id="otrosLabel">
          <input type="radio" name="genero" value="otros" id="otrosRadio"> Otros
          <img src="Cliparts-de-Mario-Bros-PNG+(67).png" alt="mario" onerror="this.src='https://www.pngall.com/wp-content/uploads/2016/06/Mario-PNG-Image.png'">
        </label>
      </div>
      <div class="field-otros" id="otrosContainer">
        <span style="color:#8fbf8f; font-size:0.5rem;">▸ Especifica:</span>
        <input type="text" class="input-text" id="otrosInput" placeholder="ej: Minecraft" style="max-width:200px;">
      </div>
    </div>

    <!-- CATEGORÍA -->
    <div class="field">
      <span class="field-label">⏣ CATEGORÍA</span>
      <div class="options-grid" id="categoriaGroup">
        <label class="opt-item" data-value="Individual">
          <input type="radio" name="categoria" value="Individual"> Individual
          <img src="Cliparts-de-Mario-Bros-PNG+(67).png" alt="mario" onerror="this.src='https://www.pngall.com/wp-content/uploads/2016/06/Mario-PNG-Image.png'">
        </label>
        <label class="opt-item" data-value="Parejas">
          <input type="radio" name="categoria" value="Parejas"> Parejas
          <img src="Cliparts-de-Mario-Bros-PNG+(67).png" alt="mario" onerror="this.src='https://www.pngall.com/wp-content/uploads/2016/06/Mario-PNG-Image.png'">
        </label>
        <label class="opt-item" data-value="Grupos">
          <input type="radio" name="categoria" value="Grupos"> Grupos
          <img src="Cliparts-de-Mario-Bros-PNG+(67).png" alt="mario" onerror="this.src='https://www.pngall.com/wp-content/uploads/2016/06/Mario-PNG-Image.png'">
        </label>
      </div>
    </div>

    <!-- ACCIONES -->
    <div class="actions">
      <button class="btn" id="guardarBtn">⏺ GUARDAR</button>
      <button class="btn" id="exportJsonBtn">⏏ EXPORTAR JSON</button>
    </div>

    <div class="status-message" id="statusMsg">>_ sistema listo · selecciona opciones</div>
  </div>

  <script>
    (function() {
      "use strict";

      // ===== ELEMENTOS =====
      const statusMsg = document.getElementById('statusMsg');
      const adminToggleBtn = document.getElementById('adminToggleBtn');
      const adminPanel = document.getElementById('adminPanel');
      const adminPass = document.getElementById('adminPass');
      const adminLoginBtn = document.getElementById('adminLoginBtn');
      const adminContent = document.getElementById('adminContent');
      const statsDisplay = document.getElementById('statsDisplay');
      const exportPdfBtn = document.getElementById('exportPdfBtn');

      const nivelGroup = document.getElementById('nivelGroup');
      const gameGroup = document.getElementById('gameGroup');
      const categoriaGroup = document.getElementById('categoriaGroup');
      const edadInput = document.getElementById('edadInput');
      const otrosInput = document.getElementById('otrosInput');
      const otrosRadio = document.getElementById('otrosRadio');
      const otrosContainer = document.getElementById('otrosContainer');
      const guardarBtn = document.getElementById('guardarBtn');
      const exportJsonBtn = document.getElementById('exportJsonBtn');

      // ===== MOSTRAR/OCULTAR ADMIN =====
      adminToggleBtn.addEventListener('click', function() {
        adminPanel.classList.toggle('open');
        if (!adminPanel.classList.contains('open')) {
          adminContent.style.display = 'none';
          adminPass.value = '';
        }
      });

      // ===== LOGIN ADMIN =====
      adminLoginBtn.addEventListener('click', function() {
        if (adminPass.value === '0308') {
          adminContent.style.display = 'block';
          mostrarEstadisticas();
          statusMsg.innerText = '🔓 Acceso administrador concedido';
        } else {
          statusMsg.innerText = '⛔ Contraseña incorrecta';
          adminContent.style.display = 'none';
        }
      });

      // ===== MOSTRAR ESTADÍSTICAS =====
      function mostrarEstadisticas() {
        const usuarios = JSON.parse(localStorage.getItem('usuarios_campeonato')) || [];
        if (usuarios.length === 0) {
          statsDisplay.innerHTML = '<pre>No hay registros aún.</pre>';
          return;
        }
        const stats = {
          total: usuarios.length,
          niveles: {},
          generos: {},
          categorias: {},
          edades: []
        };
        usuarios.forEach(u => {
          stats.niveles[u.nivel] = (stats.niveles[u.nivel] || 0) + 1;
          stats.generos[u.genero] = (stats.generos[u.genero] || 0) + 1;
          stats.categorias[u.categoria] = (stats.categorias[u.categoria] || 0) + 1;
          stats.edades.push(parseInt(u.edad));
        });
        const sumEdad = stats.edades.reduce((a,b) => a+b, 0);
        stats.promedioEdad = (stats.edades.length > 0) ? (sumEdad / stats.edades.length).toFixed(1) : 0;

        let texto = `📊 ESTADÍSTICAS (${stats.total} registros)\n\n`;
        texto += `NIVELES:\n`;
        for (let [k,v] of Object.entries(stats.niveles)) texto += `  ${k}: ${v}\n`;
        texto += `\nGÉNEROS:\n`;
        for (let [k,v] of Object.entries(stats.generos)) texto += `  ${k}: ${v}\n`;
        texto += `\nCATEGORÍAS:\n`;
        for (let [k,v] of Object.entries(stats.categorias)) texto += `  ${k}: ${v}\n`;
        texto += `\nEDAD PROMEDIO: ${stats.promedioEdad} años`;
        statsDisplay.innerHTML = `<pre>${texto}</pre>`;
      }

      // ===== EXPORTAR PDF =====
      exportPdfBtn.addEventListener('click', function() {
        const element = document.getElementById('statsDisplay');
        if (!element || element.innerText.includes('No hay registros')) {
          statusMsg.innerText = '⛔ No hay datos para generar PDF';
          return;
        }
        // Usar html2pdf para convertir el contenido a PDF
        const opt = {
          margin:       0.5,
          filename:     'estadisticas_campeonato.pdf',
          image:        { type: 'jpeg', quality: 0.98 },
          html2canvas:  { scale: 2, letterRendering: true },
          jsPDF:        { unit: 'in', format: 'letter', orientation: 'portrait' }
        };
        html2pdf().set(opt).from(element).save();
        statusMsg.innerText = '📄 PDF generado y descargado';
      });

      // ===== RESALTAR OPCIÓN SELECCIONADA (con Mario) =====
      function setupRadioHighlight(group) {
        const radios = group.querySelectorAll('input[type="radio"]');
        radios.forEach(radio => {
          radio.addEventListener('change', function() {
            const parentLabel = this.closest('.opt-item');
            if (!parentLabel) return;
            // quitar selección de todos en el grupo
            const allLabels = group.querySelectorAll('.opt-item');
            allLabels.forEach(lb => lb.classList.remove('selected'));
            if (this.checked) {
              parentLabel.classList.add('selected');
              // Mostrar campo "otros" si corresponde
              if (this.value === 'otros') {
                otrosContainer.style.display = 'flex';
              } else {
                otrosContainer.style.display = 'none';
              }
            }
          });
        });
      }

      setupRadioHighlight(nivelGroup);
      setupRadioHighlight(gameGroup);
      setupRadioHighlight(categoriaGroup);

      // Inicialmente ocultar "otros"
      otrosContainer.style.display = 'none';

      // Si se selecciona "otros" manualmente
      otrosRadio.addEventListener('change', function() {
        if (this.checked) {
          otrosContainer.style.display = 'flex';
        } else {
          otrosContainer.style.display = 'none';
        }
      });

      // ===== GUARDAR DATOS =====
      function guardarDatos() {
        const nivel = document.querySelector('input[name="nivel"]:checked');
        const genero = document.querySelector('input[name="genero"]:checked');
        const categoria = document.querySelector('input[name="categoria"]:checked');
        const edad = edadInput.value.trim();

        if (!nivel) { statusMsg.innerText = '⚠ SELECCIONA UN NIVEL'; return; }
        if (!genero) { statusMsg.innerText = '⚠ SELECCIONA UN GÉNERO'; return; }
        if (!categoria) { statusMsg.innerText = '⚠ SELECCIONA UNA CATEGORÍA'; return; }
        if (edad === '' || isNaN(edad) || parseInt(edad) < 6 || parseInt(edad) > 99) {
          statusMsg.innerText = '⚠ EDAD INVÁLIDA (6-99)';
          return;
        }

        let generoVal = genero.value;
        if (generoVal === 'otros') {
          const otrosText = otrosInput.value.trim();
          if (otrosText === '') {
            statusMsg.innerText = '⚠ ESPECIFICA EL JUEGO EN "OTROS"';
            return;
          }
          generoVal = `otros: ${otrosText}`;
        }

        const data = {
          nivel: nivel.value,
          edad: edad,
          genero: generoVal,
          categoria: categoria.value,
          timestamp: new Date().toISOString()
        };

        let usuarios = JSON.parse(localStorage.getItem('usuarios_campeonato')) || [];
        usuarios.push(data);
        localStorage.setItem('usuarios_campeonato', JSON.stringify(usuarios));

        statusMsg.innerText = `✔ DATOS GUARDADOS · ${usuarios.length} registros`;
        // Actualizar estadísticas si admin está abierto
        if (adminPanel.classList.contains('open') && adminContent.style.display === 'block') {
          mostrarEstadisticas();
        }
      }

      guardarBtn.addEventListener('click', guardarDatos);

      // ===== EXPORTAR JSON =====
      function exportarJSON() {
        const usuarios = JSON.parse(localStorage.getItem('usuarios_campeonato')) || [];
        if (usuarios.length === 0) {
          statusMsg.innerText = '⛔ NO HAY DATOS PARA EXPORTAR';
          return;
        }
        const blob = new Blob([JSON.stringify(usuarios, null, 2)], { type: 'application/json' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = `usuarios_campeonato_${new Date().toISOString().slice(0,10)}.json`;
        link.click();
        URL.revokeObjectURL(link.href);
        statusMsg.innerText = `📤 JSON exportado (${usuarios.length} registros)`;
      }

      exportJsonBtn.addEventListener('click', exportarJSON);

      // ===== INICIALIZAR CONTADOR =====
      window.addEventListener('load', function() {
        const usuarios = JSON.parse(localStorage.getItem('usuarios_campeonato')) || [];
        if (usuarios.length > 0) {
          statusMsg.innerText = `🟢 ${usuarios.length} registros guardados`;
        }
      });

    })();
  </script>
</body>
</html>
